id = "openloc"
name = "openloc"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Open file references in the Neovim that already belongs to the workspace"
platforms = ["linux", "macos"]

[[actions]]
id = "pick"
title = "Open a file reference from this pane"
contexts = ["pane", "selection"]
command = ["bash", "bin/openloc-herdr", "pick"]

[[actions]]
id = "open-url"
title = "Open clicked file link in Neovim"
contexts = ["pane"]
command = ["bash", "bin/openloc-herdr", "open-url"]

[[link_handlers]]
id = "file-link"
title = "Open in workspace Neovim"
pattern = '^https://openloc\.invalid/o\?.*$'
action = "open-url"
